<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiloRoot</title>
<link rel="icon" type="image/png" href="__BRAND_ICON__">
<style>
:root{--bg:#ECE5E0;--surface:#F5EFEB;--border:#DDD4CD;--line:#CFC5BD;--code-bg:#E6DED7;--ink:#2F4156;--muted:#4D6878;--faint:#55707E;--accent:#3F6474;--accent-bg:#C8D9E6;--on-accent:#F5EFEB;--add-bg:#DCE8E4;--add-ink:#2F5E55;--del-bg:#EFDCD8;--del-ink:#8A4A44;--flash-bg:#F0DFC4;--flash-bar:#C9A46A;--attn:#B7835A;--shadow:rgba(47,65,86,.10);--shadow-soft:rgba(47,65,86,.06)}
@media (prefers-color-scheme: dark){:root{--bg:#1C2733;--surface:#2F4156;--border:#43586E;--line:#52687D;--code-bg:#26364A;--ink:#F5EFEB;--muted:#C8D9E6;--faint:#A3B8C6;--accent:#C8D9E6;--accent-bg:#40596D;--on-accent:#1C2733;--add-bg:#24443F;--add-ink:#A9D3C6;--del-bg:#4A2F2E;--del-ink:#E8B7AE;--flash-bg:#5A4A33;--flash-bar:#D9B77E;--attn:#D9A47A;--shadow:rgba(0,0,0,.35);--shadow-soft:rgba(0,0,0,.25)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:15px;line-height:1.65}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:inline-flex;align-items:center}.brand picture,.brand .logo{display:block;height:22px;width:auto}
.meta{font-size:13px;color:var(--muted)}
#nav{display:flex;gap:4px;flex-wrap:wrap}
#nav a{padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500}
#nav a:hover{text-decoration:none;background:var(--code-bg)}
#nav a.on{background:var(--accent-bg);color:var(--accent)}
.search{margin-left:auto;flex:0 1 320px;min-width:200px;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
main{max-width:1280px;margin:0 auto;padding:24px 20px 64px}
h1.page{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 8px}
.row{display:flex;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .r{color:var(--faint);font-size:13px;white-space:nowrap}
.path{color:var(--faint);font-size:12px;word-break:break-all}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--code-bg);color:var(--muted);margin-right:4px;white-space:nowrap}
.chip.add{background:var(--add-bg);color:var(--add-ink)}.chip.del{background:var(--del-bg);color:var(--del-ink)}.chip.acc{background:var(--accent-bg);color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;min-height:36px;font-size:14px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit}
.pill:hover{text-decoration:none;border-color:var(--faint)}
.pill.on{background:var(--accent-bg);color:var(--accent);border-color:transparent;font-weight:600}
details.chg{border-top:1px solid var(--border);padding:8px 0}
details.chg:first-of-type{border-top:0}
details.chg summary{cursor:pointer}
.chgx{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;margin-top:12px}
.chgl{display:flex;flex-direction:column;gap:2px;max-height:72vh;overflow:auto}
.chgi{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;color:var(--ink)}
.chgi:hover{background:var(--code-bg)}
.chgi.on{background:var(--accent-bg);border-color:var(--line)}
.chgi .tt{display:block;font-weight:600;font-size:14px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chgd{min-width:0;border-left:1px solid var(--border);padding-left:16px}
.chgh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.chgh h3{margin:0;font-size:17px}
.chgmd{max-height:60vh;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:4px 16px;background:var(--bg)}
@media (max-width:760px){.chgx{grid-template-columns:1fr}.chgl{max-height:none}.chgd{border-left:0;padding-left:0;border-top:1px solid var(--border);padding-top:12px}}
pre.diff{margin:8px 0 0;padding:8px 0;background:var(--code-bg);border-radius:8px;overflow-x:auto;font-size:12.5px;line-height:1.55}
pre.diff div{padding:0 12px;white-space:pre-wrap;word-break:break-word}
pre.diff .a{background:var(--add-bg);color:var(--add-ink)}pre.diff .d{background:var(--del-bg);color:var(--del-ink)}pre.diff .g{color:var(--faint)}
.doc{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.doc article{flex:999 1 600px;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px 28px}
.doc aside{flex:1 1 280px;min-width:0}
.md h1{font-size:24px;margin:0 0 12px}.md h2{font-size:19px;margin:28px 0 10px}.md h3{font-size:16px;margin:22px 0 8px}.md h4,.md h5,.md h6{font-size:15px;margin:18px 0 6px}
.md p{margin:8px 0}
.md code{background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:13px;word-break:break-all}
.md a.int code{color:var(--accent)}
.md pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto}.md pre code{background:none;padding:0;word-break:normal}
.md blockquote{margin:10px 0;padding:4px 14px;border-left:3px solid var(--line);color:var(--muted)}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:10px 0;font-size:14px}
.md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--code-bg)}
.md ul.l{list-style:none;padding:0;margin:8px 0}.md ul.l li{position:relative;padding-left:16px;margin:3px 0}.md ul.l li.b::before{content:'•';position:absolute;left:3px;color:var(--faint)}.md ul.l li.c,.md ul.l li.n{padding-left:0}
.md hr{border:0;border-top:1px solid var(--border);margin:20px 0}
.md details.tg{border:1px solid var(--border);border-radius:8px;padding:6px 12px;margin:10px 0}.md details.tg summary{font-weight:600;cursor:pointer}
.md .broken{border-bottom:1px dotted var(--faint)}
.side .card{padding:12px 14px}
.side h3{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
.side ul{list-style:none;margin:0;padding:0;font-size:14px}
.side li{padding:3px 0}
.kind{font-size:11px;color:var(--faint);margin-left:6px}
.lnk{background:none;border:0;padding:2px 0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;text-align:left}
.lnk:hover{text-decoration:underline}
.graphwrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.graphwrap svg text{font-size:11px;fill:var(--ink);pointer-events:none}
table.objs{width:100%;border-collapse:collapse;font-size:14px}
table.objs td,table.objs th{padding:8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.objs th{color:var(--muted);font-weight:600;font-size:13px}
.empty{color:var(--muted)}
mark.hl{background:var(--accent-bg);color:inherit}
.note{font-size:13px;color:var(--muted)}
.gfilters{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px 2px;margin-bottom:12px}
.gfilters .pills{margin-bottom:10px;align-items:center}
.glabel{font-size:12px;font-weight:600;color:var(--faint);min-width:34px}
.fchip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;transition:opacity .15s,background .15s}
.fchip:hover{background:var(--code-bg)}
.fchip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.fchip .cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.fchip.off{opacity:.45}.fchip.off i{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--faint)}
.gwrap{position:relative;border:1px solid var(--border);border-radius:14px;overflow:hidden;height:calc(100vh - 280px);min-height:480px;background-color:var(--surface);background-image:radial-gradient(var(--border) 1px,transparent 1.2px);background-size:24px 24px}
#gsvg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
#gsvg.panning{cursor:grabbing}
/* 점과 선에는 opacity 전환 효과를 두지 않는다. 마우스를 올릴 때마다 수백 개가 한꺼번에 움직여, 크게 확대한 화면에서 브라우저가 하얗게 깜빡였다 */
#gl line{stroke:var(--line);stroke-width:1.1}
#gl line.lk{stroke-dasharray:5 4}
#gl line.pr{stroke-dasharray:2 3;stroke-width:1.6}
#gl line.hot{stroke:var(--accent);stroke-width:2;opacity:1}
#gl line.dim{opacity:.12}
.nd{cursor:pointer}
.nd .halo{opacity:0;transition:opacity .15s}
.nd .dot{stroke:var(--surface);stroke-width:2}
.nd.hov .halo,.nd.sel .halo{opacity:.22}
.nd.sel .dot{stroke:var(--ink);stroke-width:2.5}
.nd.dim{opacity:.18}
.nd .lb{font-size:calc(11.5px * var(--zk,1));fill:var(--ink);stroke:var(--surface);stroke-width:calc(3.5px * var(--zk,1));paint-order:stroke;stroke-linejoin:round;pointer-events:none;dominant-baseline:central;transform:translateX(calc(5px * var(--zk,1)))}
.gcommon{margin-bottom:10px;align-items:center}
.gchip{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;text-decoration:none}
.gchip:hover{background:var(--code-bg)}
.gchip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.gchip .cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.gempty{position:absolute;left:0;right:0;top:40%;text-align:center}
.nd.sel .lb,.nd.hov .lb{font-weight:700}
#gl path.bun{stroke-opacity:.5}
#gl path.bun.hot{stroke-opacity:1}
.gtools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.gtools button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;box-shadow:0 1px 3px var(--shadow-soft)}
.gtools button:hover{background:var(--code-bg)}
.gtools button.wide{font-size:12px;font-weight:600}
.gzoom{position:absolute;bottom:10px;right:14px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;pointer-events:none}
.ginfo{position:absolute;left:12px;top:12px;width:300px;max-width:calc(100% - 76px);max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;z-index:2;box-shadow:0 6px 20px var(--shadow)}
.ginfo[hidden]{display:none}
/* 제목부터 "연결된 문서" 제목까지는 고정하고 문서 목록만 스크롤한다 */
.ginfo>*{flex:none}
.ginfo .ghead{display:flex;gap:10px;align-items:flex-start}
.ginfo .gdot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none}
.ginfo .gx{background:none;border:0;color:var(--faint);font-size:20px;line-height:1;cursor:pointer;width:32px;height:32px;margin:-6px -8px 0 0;border-radius:8px}
.ginfo .gx:hover{background:var(--code-bg);color:var(--ink)}
.ginfo .gstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
.ginfo .gstats span{background:var(--code-bg);border-radius:8px;padding:6px 8px;font-size:11px;color:var(--muted)}
.ginfo .gstats b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.ginfo .gopen{display:flex;align-items:center;justify-content:center;min-height:38px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px}
.ginfo .gopen:hover{text-decoration:none;opacity:.92}
.ginfo h3{font-size:12px;color:var(--faint);margin:14px 0 4px;font-weight:600}
/* 목록은 항목 10개(한 줄 29px)까지 보이고 나머지는 스크롤한다 */
.ginfo ul{list-style:none;margin:0 -10px 0 0;padding:0 10px 0 0;flex:0 1 auto;min-height:0;max-height:290px;overflow:auto}
/* 스크롤바: 바탕 칸과 화살표 없이 얇은 막대만, 상자 색에 맞춘다 */
.ginfo ul::-webkit-scrollbar{width:6px}
.ginfo ul::-webkit-scrollbar-track{background:transparent}
.ginfo ul::-webkit-scrollbar-button{display:none}
.ginfo ul::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.ginfo ul::-webkit-scrollbar-thumb:hover{background:var(--faint)}
@supports not selector(::-webkit-scrollbar){.ginfo ul{scrollbar-width:thin;scrollbar-color:var(--border) transparent}}
.ginfo li{padding:1px 0}
/* 항목 높이를 한 줄로 맞춘다. 긴 이름은 …로 자르고 마우스를 올리면 전체가 보인다 */
.ginfo .gnb{display:block;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.md .mdimg{display:block;margin:12px 0}
.md .mdimg img{display:block;max-width:100%;height:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;box-sizing:border-box}
.md .mdimg .cap{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.md .flash,.row.flash,.chgi.flash{animation:fvflash 6s ease-out;border-radius:4px}
@keyframes fvflash{0%,40%{background:var(--flash-bg);box-shadow:-4px 0 0 var(--flash-bar)}100%{background:transparent;box-shadow:none}}
#toast[hidden]{display:none}
#toast{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:0 6px 20px var(--shadow);font-size:14px}
.doctools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 10px}
.side textarea,.eform input,.rnote{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.side textarea{resize:vertical;min-height:84px}
.crow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.note.err{color:var(--del-ink)}
.cquote{position:relative;background:var(--code-bg);border-radius:8px;padding:8px 32px 8px 10px;margin:0 0 8px;font-size:13px}
.cquote .gx{position:absolute;top:4px;right:4px;background:none;border:0;color:var(--faint);font-size:18px;cursor:pointer;width:28px;height:28px}
.etext{width:100%;box-sizing:border-box;min-height:60vh;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1.6 Consolas,'D2Coding',monospace;resize:vertical}
.elabel{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.eform{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
select,#ekind{min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.fcol{background:var(--code-bg);border-radius:12px;padding:12px}
.fcol h2{font-size:15px;margin:0 0 10px}
.fcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.fhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.fq{margin:8px 0;padding:2px 10px;border-left:3px solid var(--line);color:var(--muted);font-size:13px}
.fc{margin:6px 0;font-size:14px}
.fr summary{cursor:pointer;font-size:13px;color:var(--accent)}
.frow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
.fstat{min-height:32px;font-size:13px}
.sect{font-size:18px;margin:28px 0 4px}
.rcard .md{margin-top:8px}
.nbadge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--surface);font-size:11px;font-weight:700;text-align:center;line-height:18px}
#gl path{fill:none;stroke:var(--line);stroke-width:1.2}
#gl path.hot{stroke:var(--accent);stroke-width:2;stroke-opacity:1}
#gl path.dim{stroke-opacity:.1}
#gl path.bun.dim{stroke-opacity:.05}
.hull circle{fill-opacity:.07;stroke-opacity:.45;stroke-width:1.5;stroke-dasharray:6 5}
.hlab text{font-size:13px;font-weight:700;fill:var(--ink);stroke:var(--surface);stroke-width:6px;stroke-linejoin:round;paint-order:stroke;cursor:grab}
.hull circle{cursor:grab}
#gsvg.hdrag,#gsvg.hdrag .hull circle,#gsvg.hdrag .hlab text{cursor:grabbing}
.nd.arch{opacity:.35}
.nd.arch.dim{opacity:.12}
/* 실시간 갱신: 새로 생긴 점은 커지며 나타나고 둘레가 퍼진다. 새 선은 그어지듯 나타난다. 지운 점과 선은 흐려지며 사라진다 */
.nd.born .dot{animation:fvborn .7s cubic-bezier(.2,1.5,.4,1) both;transform-box:fill-box;transform-origin:center}
.nd.born .halo{animation:fvhalo 1.6s ease-out 4 both;transform-box:fill-box;transform-origin:center}
/* 새 선은 그어진 뒤에도 강조색으로 한동안 남았다가 천천히 보통 선으로 돌아간다 */
#gl path.fresh{animation:fvfresh 6s ease-in forwards}
@keyframes fvfresh{0%,70%{stroke:var(--accent);stroke-width:2;stroke-opacity:1}100%{stroke:var(--line);stroke-width:1.2}}
.nd.born .lb{font-weight:700}
#gl path.born{stroke:var(--accent);stroke-width:2;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:fvdraw .9s .3s ease-out forwards}
#gghost .ghost{pointer-events:none;animation:fvgone 1s ease-in forwards}
#gghost path.ghost{fill:none;stroke:var(--del-ink);stroke-width:1.6;stroke-dasharray:4 3}
#gghost circle.ghost{stroke:var(--del-ink);stroke-width:2}
@keyframes fvborn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fvhalo{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@keyframes fvdraw{to{stroke-dashoffset:0}}
@keyframes fvgone{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion: reduce){.nd.born .dot,.nd.born .halo,#gl path.born,#gl path.fresh,#gghost .ghost{animation-duration:.01s}}
body.fit{height:100vh;overflow:hidden;display:flex;flex-direction:column}
body.fit main{flex:1;min-height:0;width:100%;box-sizing:border-box;display:flex;flex-direction:column;padding-bottom:16px}
body.fit #view{flex:1;min-height:0;display:flex;flex-direction:column}
body.fit #view>.gwrap{flex:1;height:auto;min-height:300px}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:0 0 12px}
.phead h1.page{margin:0}
.phead .sub{margin:0}
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px}
.pane{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.pane.grow{flex:1}
.pane-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:36px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:14px}
.pane-b{flex:1;min-height:0;overflow:auto;padding:6px}
.pane-b.pad{padding:14px 18px}

<script id="data" type="application/json">__VIEWER_DATA__</script>
<script>
(function () {

const D = JSON.parse(document.getElementById('data').textContent);

const folders = [...new Set(D.docs.map(d => d.folder))].sort();
const DARK = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
// 폴더별 노드 색. 브랜드 네 색(네이비, 틸, 스카이블루, 베이지)에서 채도를 낮춘 톤으로 맞췄다.
const PAL = DARK
  ? ['#C8D9E6', '#8FB2C1', '#E6D3BD', '#A9C4B6', '#C3AFC9', '#AEB8C2', '#D9A898', '#7FA3BE', '#F5EFEB']

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const docHref = p => '#doc/' + encodeURIComponent(p);
const short = t => (t.length > 18 ? t.slice(0, 17) + '…' : t);
function ago(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return '방금';
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  if (s < 86400 * 30) return Math.floor(s / 86400) + '일 전';
  const d = new Date(ms);
  return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate();
}
function fmtTime(ms) {

}

}
$('#meta').textContent = '문서 ' + D.docs.length + '개, 연결 ' + D.edges.length + '개, ' + fmtTime(D.builtAt) + ' 생성';

// ---------- 마크다운 그리기 ----------
// HTML은 모두 글자로 바꾼 뒤 몇 가지 태그만 되살린다. 노션 사본의 toggle은 접는 블록으로 바꾼다.
// 문서 안 그림 경로를 폴더 맨 위 기준으로 바꾼다. 서버로 열면 /file로, 파일로 열면 _viewer 기준 상대 경로로 읽는다.

    h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (m, alt, url) => {
      const rel = resolveRel(RENDER_BASE, url.replace(/&amp;/g, '&'));
      if (!rel) return '<span class="broken" title="밖의 그림은 불러오지 않습니다">[그림] ' + alt + '</span>';
      return '<span class="mdimg"><img src="' + esc(imgSrc(rel)) + '" alt="' + alt + '" loading="lazy">' + (alt ? '<span class="cap">' + alt + '</span>' : '') + '</span>';
    });
    h = h.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (m, txt, url) => {
      const raw = url.replace(/&amp;/g, '&'), t = lm[raw];
      if (t) return '<a href="' + docHref(t) + '">' + txt + '</a>';
      if (/^https?:\/\//i.test(raw)) return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + txt + '</a>';
      if (raw.startsWith('#')) return txt;
      return '<span class="broken" title="' + url + '">' + txt + '</span>';
    });
    h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/&lt;(\/?)(b|strong|i|em|u)&gt;/g, '<$1$2>').replace(/&lt;br\s*\/?&gt;/g, '<br>');

  t = t.replace(/\r\n/g, '\n').replace(/<!--[\s\S]*?-->/g, '');
  if (t.startsWith('---\n')) { const e = t.indexOf('\n---', 4); if (e > 0) t = t.slice(t.indexOf('\n', e + 1) + 1); }
  t = t.replace(/<image\b[^>]*?\/>/g, '\n> [그림]\n');
  t = t.replace(/<image\b[^>]*>([\s\S]*?)<\/image>/g, (m, c) => '\n> [그림] ' + c.trim().replace(/\s*\n\s*/g, ' ') + '\n');
  t = t.replace(/<embed\b[^>]*\/?>/g, '\n> [첨부]\n');
  t = t.replace(/^\s*<\/?(columns|column|callout)\b[^>]*>\s*$/gm, '');

}
const isList = l => /^(\s*)([-*+]|\d+\.)\s+/.test(l);
const startsBlock = l => /^(#{1,6})\s|^\s*```|^\s*>|^\s*\||^\s*<\/?toggle/.test(l) || isList(l) || /^\s*(-{3,}|\*{3,})\s*$/.test(l);
function table(rows, lm) {
  const cells = r => { let s = r.trim(); if (s.startsWith('|')) s = s.slice(1); if (s.endsWith('|')) s = s.slice(0, -1); return s.split(/(?<!\\)\|/).map(c => c.trim()); };
  let h = '<table><thead><tr>' + cells(rows[0]).map(c => '<th>' + inline(c, lm) + '</th>').join('') + '</tr></thead><tbody>';
  for (const r of rows.slice(2)) h += '<tr>' + cells(r).map(c => '<td>' + inline(c, lm) + '</td>').join('') + '</tr>';

function blocks(L, lm) {

  while (i < L.length) {
    const l = L[i];
    if (/^\s*```/.test(l)) {

// ---------- 화면 ----------

// 바뀐 문서 목록: 새 문서, 고친 문서, 지운 문서를 최근에 고친 순으로
function changeItems() {

    ...C.modified.map(c => ({ kind: 'modified', path: c.path, c, chip: '<span class="chip add">+' + c.plus + '</span><span class="chip del">-' + c.minus + '</span>' })),

  const d = byPath.get(it.path);
  const acts = (SERVED && it.kind !== 'doc' ? '<button type="button" class="pill on" id="seenOne">확인</button>' : '') +
    (d ? '<a class="pill" href="' + docHref(it.path) + '">문서 열기</a>' : '');

  else if (it.kind === 'doc' && d) h += '<div class="md chgmd">' + md(d.text, d.linkMap, d.path) + '</div>';

}
const ss = { get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) { /* 기억 못 해도 동작한다 */ } } };
function viewRecent() {

function snippet(t, q) {
  const i = t.toLowerCase().indexOf(q);
  if (i < 0) return '';
  const s = Math.max(0, i - 40);
  return esc((s ? '…' : '') + t.slice(s, i)) + '<mark class="hl">' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length, i + q.length + 60)) + '…';
}
// 문서: 왼쪽 폴더 트리, 오른쪽 고른 폴더의 문서 목록
function folderTree() {
  const root = { name: '맨 위', path: '', kids: new Map(), docs: [], total: 0 };
  for (const d of D.docs) {
    const parts = d.path.split('/'); parts.pop();
    let node = root; root.total++;
    let acc = '';
    for (const p of parts) {
      acc = acc ? acc + '/' + p : p;
      if (!node.kids.has(p)) node.kids.set(p, { name: p, path: acc, kids: new Map(), docs: [], total: 0 });
      node = node.kids.get(p); node.total++;
    }
    node.docs.push(d);
  }
  return root;
}
function findFolder(node, p) {
  if (node.path === p) return node;
  for (const k of node.kids.values()) { const f = findFolder(k, p); if (f) return f; }
  return null;
}
function viewDocs(q) {
  q = (q || '').trim().toLowerCase();
  const tree = folderTree();
  let sel = ss.get('fv-docs-folder') || '';
  if (!findFolder(tree, sel)) sel = '';
  const closed = new Set(JSON.parse(ss.get('fv-docs-closed') || '[]'));
  const branch = (node, depth) => {
    const kids = [...node.kids.values()].sort((a, b) => a.name.localeCompare(b.name));
    const isOpen = !closed.has(node.path);
    let h = '<div class="tnode"><button type="button" class="navi tfold' + (!q && node.path === sel ? ' on' : '') + '" data-f="' + esc(node.path) + '" style="padding-left:' + (8 + depth * 14) + 'px">' +
      (kids.length ? '<span class="caret" data-t="' + esc(node.path) + '" aria-label="' + (isOpen ? '접기' : '펼치기') + '">' + (isOpen ? '▾' : '▸') + '</span>' : '<span class="caret"></span>') +
      '<span class="fdot" style="background:' + (node.path ? color(node.path.split('/')[0]) : 'var(--faint)') + '"></span><span class="fname">' + esc(node.name) + '</span><span class="cnt">' + node.total + '</span></button>';
    if (kids.length && isOpen) h += kids.map(k => branch(k, depth + 1)).join('');
    return h + '</div>';
  };
  const row = d => '<div class="drow"><div class="t">' + docLink(d.path) + '<div class="path">' + esc(d.path) + '</div>' +
    (q && !d.title.toLowerCase().includes(q) && !d.path.toLowerCase().includes(q) ? '<div class="path">' + snippet(d.text, q) + '</div>' : '') + '</div>' +
    '<div class="r">' + (d.fm && d.fm.type ? '<span class="chip">' + esc(d.fm.type) + '</span>' : '') + (d.fm && d.fm.status ? statusChip(String(d.fm.status)) : '') + '<span class="when">' + ago(d.mtime) + '</span></div></div>';
  let right;
  if (q) {
    const hit = D.docs.filter(d => d.title.toLowerCase().includes(q) || d.path.toLowerCase().includes(q) || d.text.toLowerCase().includes(q));
    right = '<div class="pane-h"><strong>"' + esc(q) + '" 검색 결과</strong><span class="path">' + hit.length + '개</span></div><div class="pane-b pad">' + (hit.map(row).join('') || '<p class="empty">찾는 문서가 없습니다.</p>') + '</div>';
  } else {
    const node = findFolder(tree, sel);
    const subs = [...node.kids.values()].sort((a, b) => a.name.localeCompare(b.name));
    const docs = [...node.docs].sort((a, b) => b.mtime - a.mtime);
    right = '<div class="pane-h"><strong>' + esc(sel ? sel.split('/').join(' / ') : '맨 위') + '</strong><span class="path">문서 ' + docs.length + '개' + (subs.length ? ', 폴더 ' + subs.length + '개' : '') + '</span></div><div class="pane-b pad">' +
      subs.map(s => '<button type="button" class="drow dfold" data-f="' + esc(s.path) + '"><span class="t"><span class="fdot" style="background:' + color(s.path.split('/')[0]) + '"></span><strong>' + esc(s.name) + '/</strong></span><span class="r"><span class="when">' + s.total + '개</span></span></button>').join('') +
      (docs.map(row).join('') || (subs.length ? '' : '<p class="empty">이 폴더에는 문서가 없습니다.</p>')) + '</div>';
  }
  let h = '<div class="phead"><h1 class="page">문서</h1><p class="sub">마크다운 문서 ' + D.docs.length + '개. 왼쪽에서 폴더를 고르면 그 폴더의 문서가 보입니다.</p></div>';
  h += '<div class="split"><section class="pane"><div class="pane-h"><strong>폴더</strong></div><nav class="pane-b tree" aria-label="폴더 트리">' + branch(tree, 0) + '</nav></section><section class="pane">' + right + '</section></div>';
  $('#view').innerHTML = h;
  const go = f => { ss.set('fv-docs-folder', f); if (closed.has(f)) { closed.delete(f); ss.set('fv-docs-closed', JSON.stringify([...closed])); } if ($('#q').value) { $('#q').value = ''; } viewDocs(''); };
  document.querySelectorAll('.tfold, .dfold').forEach(b => b.addEventListener('click', e => {
    const t = e.target.closest('.caret[data-t]');
    if (t) { e.stopPropagation(); const k = t.dataset.t; if (closed.has(k)) closed.delete(k); else closed.add(k); ss.set('fv-docs-closed', JSON.stringify([...closed])); viewDocs(q); return; }
    go(b.dataset.f);
  }));
}

let claimFilter = '전체', showDone = false;

function viewObjects(tab) {

  $('#view').innerHTML = h;
  const td = $('#tgDone'); if (td) td.addEventListener('click', () => { showDone = !showDone; viewObjects('questions'); });
  document.querySelectorAll('.cf').forEach(b => b.addEventListener('click', () => { claimFilter = b.dataset.k; viewObjects('claims'); }));
}

function saveGS() {

// ---------- 피드백, 편집, 규칙 후보 ----------
// 흐름: 댓글(type: feedback, 대기) → AI가 처리(진행 중 → 완료, 처리 내용을 파일에 적음)
//       웹 편집(이유와 함께 기록) → AI가 규칙 후보(type: rule, 제안)를 만듦 → 사용자가 승인 → AI가 writing-guide.md에 반영
const SERVED = location.protocol.startsWith('http');
const cut = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
async function post(url, obj) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(obj) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('요청 실패 ' + r.status));
  return j;
}
const CHIP = { '대기': '', '진행 중': ' acc', '완료': ' add', '안 함': ' del', '제안': ' acc', '승인': ' add', '거절': ' del', '반영': '' };
const statusChip = s => '<span class="chip' + (CHIP[s] || '') + '">' + esc(s || '상태 없음') + '</span>';
function sections(text) {
  const out = {}; let cur = null;
  for (const line of String(text).replace(/^---\n[\s\S]*?\n---\n?/, '').split('\n')) {
    const m = line.match(/^##\s+(.+)$/);
    if (m) { cur = m[1].trim(); out[cur] = ''; continue; }
    if (cur) out[cur] += line + '\n';
  }
  for (const k of Object.keys(out)) out[k] = out[k].trim();
  return out;
}
const PLACEHOLDER = /^\(AI가 처리하면/;
function feedbackItems() {
  return D.docs.filter(d => d.fm && d.fm.type === 'feedback').map(d => {
    const s = sections(d.text);
    return {
      path: d.path, status: String(d.fm.status || ''), created: String(d.fm.created || ''), target: (d.related || [])[0] || '',
      quote: (s['고른 부분'] || '').replace(/^>\s?/gm, ''), comment: s['댓글'] || '', result: PLACEHOLDER.test(s['처리'] || '') ? '' : (s['처리'] || ''),
      memo: s['메모'] || '', title: d.title,
    };
  }).sort((a, b) => b.path.localeCompare(a.path));
}
function ruleItems() {
  return D.docs.filter(d => d.fm && d.fm.type === 'rule').map(d => {
    const s = sections(d.text);
    return { path: d.path, status: String(d.fm.status || ''), title: d.title, rule: s['제안하는 규칙'] || '', basis: s['근거가 된 수정'] || '', memo: s['메모'] || '', linkMap: d.linkMap };
  }).sort((a, b) => b.path.localeCompare(a.path));
}
const feedbackFor = p => feedbackItems().filter(f => f.target === p);

function wireDocTools(d) {
  const art = $('#art'); let quote = '';
  const showQuote = () => { const q = $('#cquote'); if (!q) return; q.hidden = !quote; q.innerHTML = quote ? '<span class="note">고른 부분</span><div>' + esc(cut(quote, 200)) + '</div><button type="button" class="gx" id="cqx" aria-label="고른 부분 지우기">×</button>' : ''; const x = $('#cqx'); if (x) x.addEventListener('click', () => { quote = ''; showQuote(); }); };
  art.addEventListener('mouseup', () => {
    const sel = window.getSelection(); const t = sel ? sel.toString().trim() : '';
    if (t && art.contains(sel.anchorNode)) { quote = t.slice(0, 600); showQuote(); }
  });
  $('#csend').addEventListener('click', async () => {
    const body = $('#ctext').value.trim(), msg = $('#cmsg');
    if (!body) { msg.textContent = '댓글을 먼저 적어 주세요.'; msg.className = 'note err'; $('#ctext').focus(); return; }
    msg.textContent = '보내는 중…'; msg.className = 'note';
    try { await post('/api/feedback', { target: d.path, quote, body }); msg.textContent = '남겼어요. AI가 다음 대화에서 집어 갑니다.'; setTimeout(() => location.reload(), 600); }
    catch (e) { msg.textContent = e.message; msg.className = 'note err'; }
  });
  $('#ctext').addEventListener('input', () => { const m = $('#cmsg'); if (m.classList.contains('err')) { m.textContent = ''; m.className = 'note'; } });
  $('#btnEdit').addEventListener('click', () => {
    art.innerHTML = '<label class="elabel" for="etext">본문 (맨 위 속성까지 그대로 고칠 수 있습니다)</label><textarea id="etext" class="etext" spellcheck="false">' + esc(d.text) + '</textarea>' +
      '<div class="eform"><div><label class="elabel" for="ekind">무엇을 바꿨나요</label><select id="ekind"><option>표현</option><option>내용</option><option>구조</option><option>기타</option></select></div>' +
      '<div style="flex:1;min-width:240px"><label class="elabel" for="ereason">왜 바꿨나요 (선택. 글쓰기 규칙을 키우는 데 씁니다)</label><input id="ereason" type="text" placeholder="예: 대시보다 문장을 나누는 게 읽기 편해서"></div></div>' +
      '<div class="crow"><button type="button" class="pill on" id="esave">저장</button><button type="button" class="pill" id="ecancel">취소</button><span class="note" id="emsg"></span></div>';
    $('#btnEdit').hidden = true;
    $('#ecancel').addEventListener('click', () => location.reload());
    $('#esave').addEventListener('click', async () => {
      const msg = $('#emsg'); msg.textContent = '저장 중…'; msg.className = 'note';
      try {
        const r = await post('/api/save', { path: d.path, text: $('#etext').value, hash: d.hash, kind: $('#ekind').value, reason: $('#ereason').value });
        msg.textContent = r.unchanged ? '바뀐 내용이 없습니다.' : '저장했어요.';
        if (!r.unchanged) setTimeout(() => location.reload(), 500);
      } catch (e) { msg.textContent = e.message; msg.className = 'note err'; }
    });
  });
}

// ---------- 나: AI가 지금 쓰고 있는 사용자 정보 ----------
// 데이터는 viewer/build.mjs의 parseMe()와 buildRadar().
// 위쪽은 폴더 기록으로 계산한 사용 방법 레이더(축마다 계산식과 근거를 보여 준다), 아래쪽은 AI가 쓰는 사용자 정보와 근거.
let meAxis = 'depth'; // 고른 축. 실시간 갱신은 페이지를 새로 고치므로 sessionStorage에 남긴다
try { meAxis = sessionStorage.getItem('fv-me-axis') || meAxis; } catch (e) { /* 못 읽으면 첫 축 */ }
function meCounts() {
  const M = D.objects.me || { approved: [], pending: [], rejected: [], writing: { principles: [], banned: [] } };
  return { M, approved: M.approved.length, pending: M.pending.length, rejected: M.rejected.length, writing: M.writing.principles.length + M.writing.banned.length };
}
function meRadarSvg(axes) {
  const W = 420, H = 320, cx = 210, cy = 158, R = 108, n = axes.length;
  const at = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const f1 = v => v.toFixed(1);
  const poly = r => axes.map((_, i) => at(i, r).map(f1).join(',')).join(' ');
  let g = [25, 50, 75, 100].map(p => '<polygon class="ring" points="' + poly(R * p / 100) + '"/>').join('');
  g += axes.map((_, i) => { const [x, y] = at(i, R); return '<line class="spoke" x1="' + cx + '" y1="' + cy + '" x2="' + f1(x) + '" y2="' + f1(y) + '"/>'; }).join('');
  g += '<polygon class="area" points="' + axes.map((a, i) => at(i, R * a.value / 100).map(f1).join(',')).join(' ') + '"/>';
  g += axes.map((a, i) => { const [x, y] = at(i, R * a.value / 100); return '<circle class="pt" r="4.5" cx="' + f1(x) + '" cy="' + f1(y) + '"><title>' + esc(a.name + ' ' + a.value) + '</title></circle>'; }).join('');
  g += axes.map((a, i) => {
    const [x, y] = at(i, R + 16), anchor = Math.abs(x - cx) < 4 ? 'middle' : x > cx ? 'start' : 'end';
    const dy = y < cy - R * 0.5 ? -16 : y > cy + R * 0.5 ? 6 : -6;
    const hx = anchor === 'start' ? x - 4 : anchor === 'end' ? x - 96 : x - 50;
    return '<g class="ax' + (a.key === meAxis ? ' on' : '') + '" data-k="' + a.key + '"><rect class="hit" x="' + f1(hx) + '" y="' + f1(y + dy - 15) + '" width="100" height="36"/>' +
      '<text x="' + f1(x) + '" y="' + f1(y + dy) + '" text-anchor="' + anchor + '">' + esc(a.name) + '</text>' +
      '<text class="v" x="' + f1(x) + '" y="' + f1(y + dy + 16) + '" text-anchor="' + anchor + '">' + a.value + '</text></g>';
  }).join('');
  return '<svg class="radar" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(axes.map(a => a.name + ' ' + a.value).join(', ')) + '">' + g + '</svg>';
}
// rows: [{date, v}] 날짜 순. 가로 위치는 날짜 간격대로
function meSpark(rows, tip) {
  const W = 160, H = 36, pad = 5, y = v => (H - pad - (H - 2 * pad) * v / 100).toFixed(1);
  const t = r => new Date(r.date + 'T00:00:00').getTime(), t0 = t(rows[0]), span = t(rows[rows.length - 1]) - t0 || 1;
  const x = r => (pad + (W - 2 * pad) * (t(r) - t0) / span).toFixed(1);
  const pts = rows.map(r => x(r) + ',' + y(r.val)).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + esc(tip) + '"><title>' + esc(tip) + '</title><polyline points="' + pts + '" vector-effect="non-scaling-stroke"/></svg>';
}
const meYmd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const meAddDays = (ymd, n) => { const d = new Date(ymd + 'T00:00:00'); d.setDate(d.getDate() + n); return meYmd(d); };
// 코멘트 갱신 시각: lib/me-schedule.mjs의 lastSlot과 같은 계산
function meLastSlot(hour, now) { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour); if (now < d) d.setDate(d.getDate() - 1); return d; }
function meDash(M) {
  const R = M.radar;
  if (!R) return '';
  const axes = R.axes, cur = axes.find(a => a.key === meAxis) || axes[0];
  const evi = cur.evidence.length ? '<ul class="meev">' + cur.evidence.map(e => '<li>' + (e.doc ? '<a href="' + docHref(e.doc) + '">' + esc(e.text) + '</a>' : esc(e.text)) + '</li>').join('') + '</ul>' : '<p class="empty">근거 없음</p>';
  let h = '<div class="medash"><section class="mebox"><h3>사용 방법 레이더 <span class="path">0~100 · ' + esc(R.today) + ' 기준</span></h3>' + meRadarSvg(axes) +
    '<div class="meaxes" role="group" aria-label="축 고르기">' + axes.map(a => '<button type="button" class="pill sm meax' + (a.key === cur.key ? ' on' : '') + '" data-k="' + a.key + '" aria-pressed="' + (a.key === cur.key) + '">' + esc(a.name) + ' ' + a.value + '</button>').join('') + '</div>' +
    '<div class="meaxis"><strong>' + esc(cur.name) + ' ' + cur.value + '</strong><p class="f">계산: ' + esc(cur.formula) + '</p><p class="f">목표: ' + esc(cur.target) + '</p>' + (cur.note ? '<p class="f">' + esc(cur.note) + '</p>' : '') +
    '<details class="fr"' + (cur.evidence.length <= 6 ? ' open' : '') + '><summary>근거 ' + cur.evidence.length + '개</summary>' + evi + '</details></div></section>';
  const C = M.comment || { doc: '', hour: 9, mtime: 0 };   // 빌더가 늘 채운다
  const c = D.docs.find(d => d.path === C.doc);
  const fmt = d => new Date(d).toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: 'numeric', minute: '2-digit' });
  const now = new Date(), slot = meLastSlot(C.hour, now), next = new Date(slot); next.setDate(next.getDate() + 1);
  const due = !C.mtime || C.mtime < slot.getTime();
  const sched = '<div class="mesched"><div><span class="k">갱신</span>매일 ' + C.hour + '시가 지난 뒤 처음 여는 대화에서 AI가 고칩니다</div>' +
    '<div><span class="k">마지막</span>' + (C.mtime ? esc(fmt(C.mtime)) : '아직 없음') + '</div>' +
    '<div><span class="k">다음</span>' + (due ? '<span class="chip warn">갱신할 차례</span> 다음 대화를 열면 고칩니다' : esc(fmt(next)) + ' 이후 첫 대화') + '</div></div>';
  h += '<section class="mebox mecomment"><h3>AI 코멘트 <span class="chip">AI의 의견, 승인된 정보 아님</span></h3>' + sched +
    (c ? '<div class="md">' + md(c.text, c.linkMap, c.path) + '</div><p class="note"><a href="' + docHref(c.path) + '">' + esc(c.path) + ' 열기</a></p>'
      : '<p class="empty">아직 없음</p>') + '</section></div>';
  const hist = M.history || [], weekAgo = meAddDays(R.today, -7);
  const base = hist.filter(r => r.date <= weekAgo).pop();
  const head = base
    ? '오늘(' + R.today.slice(5) + ') 값을 일주일 전 기록(' + base.date.slice(5) + ')과 비교합니다.'
    : '일주일 전 기록이 아직 없습니다. 기록은 ' + (hist[0] ? hist[0].date.slice(5) : R.today.slice(5)) + '부터 쌓였고 ' + meAddDays(hist[0] ? hist[0].date : R.today, 7).slice(5) + '부터 비교할 수 있습니다.';
  const recent = hist.filter(r => r.date >= meAddDays(R.today, -30));
  h += '<section class="mebox" style="margin-bottom:14px"><h3>일주일 전과 비교</h3><p class="note" style="margin:0 0 10px">' + head + ' 뷰어를 만들 때마다 그날 다섯 값을 하루 한 줄씩 남깁니다.</p><div class="metrend">' +
    axes.map(a => {
      const b0 = base ? base.v[a.key] : null, d = typeof b0 === 'number' ? a.value - b0 : null;
      const chip = d === null ? '' : ' <span class="chip ' + (d > 0 ? 'add' : d < 0 ? 'del' : '') + '">' + (d > 0 ? '+' + d : d < 0 ? d : '그대로') + '</span>';
      const sub = d === null ? '비교할 기록 없음' : '일주일 전 ' + b0;
      const rows = recent.filter(r => typeof r.v[a.key] === 'number').map(r => ({ date: r.date, val: r.v[a.key] }));
      const line = rows.length > 1 ? meSpark(rows, rows.map(r => r.date.slice(5) + ' ' + r.val).join(' · ')) + '<div class="sx"><span>' + rows[0].date.slice(5) + '</span><span>' + rows[rows.length - 1].date.slice(5) + '</span></div>' : '';
      return '<div class="tr"><div class="n">' + esc(a.name) + '</div><div class="v">' + a.value + chip + '</div><div class="note">' + sub + '</div>' + line + '</div>';
    }).join('') + '</div></section>';
  return h;
}
function viewMe() {
  const { M, approved, pending, rejected, writing } = meCounts();
  const nope = (target, quote) => SERVED
    ? '<div class="crow"><button type="button" class="pill sm nope" data-t="' + esc(target) + '" data-q="' + esc(quote) + '">이건 아니에요</button></div><div class="nopef" hidden></div>'
    : '';
  const ev = (list, src) => list.length || src
    ? '<details class="fr"><summary>근거 ' + list.length + '개' + (src ? ' · ' + esc(src.split('/').pop().replace(/\.md$/, '')) : '') + '</summary><ul class="meev">' + list.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul>' + (src ? '<a class="path" href="' + docHref(src) + '">후보 파일 열기</a>' : '') + '</details>'
    : '';
  const item = a => '<article class="ocard"><div class="ohead"><strong>' + esc(a.item) + '</strong>' + (a.approvedAt ? '<span class="chip add">승인 ' + esc(a.approvedAt) + '</span>' : '') + '</div>' +
    '<p class="fc">' + esc(a.content) + '</p>' + ev(a.evidence, a.source) + nope(M.profile, a.item + ': ' + a.content) + '</article>';

  let b = '';
  if (M.pending.length) {
    b += '<h3 class="osec">기다리는 후보 <span class="path">' + M.pending.length + '</span></h3>';
    b += M.pending.map(t => '<article class="ocard"><div class="ohead">' + statusChip(t.status) + '<strong>' + esc(t.item || t.title) + '</strong>' + (t.group ? '<span class="chip">' + esc(t.group) + '</span>' : '') + '</div>' +
      '<p class="fc">' + esc(t.content) + '</p>' + ev(t.evidence, t.doc) +
      '<p class="note">' + (t.status === '승인' ? '승인했고 AI가 profile.md에 옮길 차례입니다.' : '대화에서 "' + esc(t.doc.split('/').pop().replace(/\.md$/, '')) + ' 승인" 또는 "거절"이라고 말하거나 파일의 status를 바꿉니다.') + '</p></article>').join('');
  }
  for (const g of M.groups) {
    const list = M.approved.filter(a => a.group === g);
    b += '<h3 class="osec">' + esc(g) + ' <span class="path">' + list.length + '</span></h3>';
    b += list.length ? list.map(item).join('') : '<p class="empty">아직 없음</p>';
  }
  const wrow = (w, quote) => '<div class="drow mew"><div class="t"><strong>' + esc(w.name) + '</strong><div class="note">' + esc(w.content) + '</div>' + nope(M.writing.doc, quote) + '</div><div class="r">' + (w.source ? '<span class="chip">' + esc(w.source.replace(/`/g, '')) + '</span>' : '') + '</div></div>';
  const wsec = (title, list, quote) => list.length ? '<h3 class="osec">' + title + '</h3>' + list.map(w => wrow(w, quote(w))).join('') : '';
  b += '<details class="ogroup"><summary><strong>글쓰기</strong> <span class="path">' + (M.writing.principles.length ? '원칙 ' + M.writing.principles.length + ' · ' : '') + '쓰지 않는 표현 ' + M.writing.banned.length + '</span></summary>' +
    wsec('원칙', M.writing.principles, w => w.name + ': ' + w.content) +
    wsec('쓰지 않는 표현', M.writing.banned, w => w.name + ' → ' + w.content) +
    (writing ? '' : '<p class="empty">아직 없음</p>') +
    '<p class="note"><a href="' + docHref(M.writing.doc) + '">writing-guide.md 열기</a></p></details>';
  b += '<details class="ogroup"><summary><strong>AI가 잘못 본 것</strong> <span class="path">거절한 후보 ' + rejected + '</span></summary>' +
    (M.rejected.length ? M.rejected.map(r => '<article class="ocard done"><div class="ohead">' + statusChip('거절') + '<span class="chip">' + esc(r.kind) + '</span><strong>' + esc(r.title) + '</strong></div>' +
      (r.content ? '<p class="fc">' + esc(r.content) + '</p>' : '') + ev(r.evidence, r.doc) + (r.memo.length ? '<p class="note">' + esc(r.memo.join(' ')) + '</p>' : '') + '</article>').join('') : '<p class="empty">없음</p>') + '</details>';

  const chip = (n, label, cls) => '<span class="chip' + (cls || '') + '">' + label + ' ' + n + '</span>';
  let h = '<div class="phead"><h1 class="page">나</h1><p class="sub">폴더 기록으로 본 내 사용 방법과, AI가 지금 쓰고 있는 나에 대한 정보입니다. 틀린 항목에는 댓글을 남기세요.</p>' +
    '<div>' + chip(approved, '승인됨', ' add') + chip(pending, '기다리는 후보', pending ? ' acc' : '') + chip(rejected, '거절한 후보', '') + chip(writing, '글쓰기 규칙', '') + '</div></div>';
  if (!SERVED) h += '<p class="note" style="margin:0 0 10px">댓글은 뷰어 서버로 열었을 때만 남길 수 있습니다.</p>';
  h += '<section class="pane grow mepane"><div class="pane-b pad">' + meDash(M) + '<h2 class="osec" style="font-size:15px;color:var(--ink)">AI가 쓰는 나에 대한 정보</h2>' + b + '</div></section>';
  $('#view').innerHTML = h;
  document.querySelectorAll('.meax, .radar .ax').forEach(el => el.addEventListener('click', () => {
    const pb = $('#view .pane-b'), sc = pb ? pb.scrollTop : 0, wy = window.scrollY;
    meAxis = el.dataset.k;
    try { sessionStorage.setItem('fv-me-axis', meAxis); } catch (e) { /* 못 남겨도 화면은 바꾼다 */ }
    viewMe();
    if ($('#view .pane-b')) $('#view .pane-b').scrollTop = sc;
    window.scrollTo(0, wy);
  }));

  document.querySelectorAll('.nope').forEach(btn => btn.addEventListener('click', () => {
    const f = btn.parentElement.nextElementSibling;
    if (!f.hidden) { f.hidden = true; return; }
    f.hidden = false;

function graphData() {
  const keep = D.docs.filter(d => (GS.showCommon || !isCommon(d)) && (GS.showArch || !isArch(d)));

// 폴더마다 돌리는 원판 배치. 큰 노드 그래프가 원판을 이루는 규칙을 d3-force와 같은 방식으로 돌린다.

const DISK = { charge: -110, link: 34, grav: 0.07, isoGrav: 0.05, ticks: 320 };

  for (let it = 0; it < DISK.ticks; it++) {
    alpha += (0 - alpha) * alphaDecay;

      const s = nodes[l.a], t = nodes[l.b];

      const d = Math.hypot(x, y) || 1e-6, k = (d - LINK) / d * alpha / Math.min(s.deg, t.deg) * (o.linkScale ? o.linkScale(s, t) : 1), b = s.deg / (s.deg + t.deg);

    }
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {

    }

    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const A = nodes[i], B = nodes[j], r = rad(A) + rad(B) + GAP;
      let dx = B.x + B.vx - A.x - A.vx, dy = B.y + B.vy - A.y - A.vy;
      const l = dx * dx + dy * dy;

const labelW = t => { let w = 0; for (const ch of t) w += /[ㄱ-힝]/.test(ch) ? 12.2 : 6.8; return Math.round(w); };

// 실시간 갱신 때: 있던 점은 있던 자리에 두고, 새 점만 이어진 점 곁(없으면 같은 폴더 곁)의 빈자리에 놓는다.
// hulls(폴더 원)를 주면 새 점은 자기 폴더 원 안에만 놓고, 빈자리가 없으면 그 원을 조금씩 키운다.

  const free = (n, x, y) => nodes.every((m, j) => {

    const around = nb.length ? nb.map(j => nodes[j]) : h ? [] : same;

}
// 점들을 모두 담는 가장 작은 원(중심 x, y와 반지름 r). 점 반지름은 부르는 쪽에서 더한다

// 원들이 다 들어오게 그림 크기를 정하고 왼쪽 위 여백에 맞춰 옮긴다 (원 위의 폴더 이름 자리까지)

// 연결 그래프가 떠 있는 동안 viewGraph가 채운다. 실시간 갱신이 지금 점 자리와 끄는 중인지를 여기서 읽는다.

  // 점을 끌면 이어진 점들이 줄에 끌려 따라오고, 둘레의 점은 살짝 비켜 준다. 놓으면 잠깐 흔들리다 멈추고 그 자리에 남는다.
  // 줄마다 처음 길이를 쉬는 길이로 둔다. 그래야 끄는 점과 상관없는 곳은 움직이지 않는다.

  const HOME = 0.012;
  let pinned = null;
  let alpha = 0, raf = null, hullBusy = false, homeBusy = false, settleFrames = 0, fitRounds = 0;

      if (!visibleLink(l) || l.loose) continue;
      const A = nodes[l.a], B = nodes[l.b], dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 0.01, f = (d - l.rest) / d * 0.035;

    for (let i = 0; i < vis.length; i++) for (let j = i + 1; j < vis.length; j++) {

        hulls: hulls ? new Map([...hulls].map(([f, h]) => [f, { cx: h.cx, cy: h.cy, r: h.r }])) : null,

    },

  if (!carry) return;
  // 새 선은 그어지듯 나타나게 길이를 넘긴다. 몇 초 뒤 강조와 지운 흔적을 걷는다.
  // 새로 생긴 선은 태어날 때 길이로 그어지는 효과를 준다. 그 뒤 점이 움직이거나 선이 휘면 길이가 늘어 효과의 점선 간격 때문에 선이 중간에 끊겨 보이므로,
  // 효과가 끝나면(또는 1.5초 뒤) born을 떼고, 끊김 없는 선으로 강조색(fresh)을 몇 초 더 남겼다가 보통 선으로 되돌린다
  lEls.forEach((el, i) => {
    if (!bornL.has(i)) return;
    el.style.setProperty('--len', String(Math.ceil(el.getTotalLength()) + 1));
    const done = () => { if (!el.classList.contains('born')) return; el.classList.remove('born'); el.style.removeProperty('--len'); el.classList.add('fresh'); };
    el.addEventListener('animationend', done, { once: true });
    setTimeout(done, 1500);
  });
  if (born.size || bornL.size || carry.ghostNodes.size) setTimeout(() => {
    born.clear(); bornL.clear();
    svgEl.querySelectorAll('.born, .fresh').forEach(el => el.classList.remove('born', 'fresh'));
    const gh = svgEl.querySelector('#gghost'); if (gh) gh.innerHTML = '';
    paint();
  }, 8000);
  const added = carry.added || [], removed = carry.removed || [];
  if (added.length || removed.length) {
    const name = p => esc(byPath.get(p) ? byPath.get(p).title : p);
    const hidden = added.filter(p => !ix.has(p) || !visibleNode(ix.get(p)));
    const parts = [];
    if (added.length) parts.push('새 문서: ' + added.map(name).join(', '));
    if (removed.length) parts.push('지운 문서: ' + removed.map(p => esc(p)).join(', '));
    if (hidden.length) parts.push(hidden.map(name).join(', ') + '은(는) 지금 보기 조건에 맞지 않아 그래프에 나오지 않아요');
    toast('<span>' + parts.join('. ') + '</span>', 6000);
  }
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1) || 'recent');
  window.scrollTo(0, 0);
  // 문서 하나를 볼 때만 페이지가 스크롤된다. 나머지 화면은 창 높이에 맞추고 안쪽 칸만 스크롤한다
  document.body.classList.toggle('fit', !h.startsWith('doc/'));
  if (h.startsWith('doc/')) { setNav('docs'); viewDoc(h.slice(4)); return; }
  if (h === 'objects' || h.startsWith('objects/')) { setNav('objects'); viewObjects(h.split('/')[1] || 'questions'); return; }
  if (h === 'docs') { setNav('docs'); viewDocs($('#q').value); return; }
  if (h === 'feedback' || h.startsWith('feedback/')) { setNav('feedback'); viewFeedback(h.split('/')[1]); return; }
  if (h === 'me') { setNav('me'); viewMe(); return; }
  if (h === 'graph') {
    setNav('graph');
    viewGraph();
    return;
  }
  setNav('recent'); viewRecent();
}
$('#q').addEventListener('input', e => {
  if (location.hash !== '#docs') history.replaceState(null, '', '#docs');
  setNav('docs'); viewDocs(e.target.value);
});
window.addEventListener('hashchange', route);
route();

// ---------- 실시간 갱신 ----------
// 서버가 파일 변경을 알려 주면, 보고 있는 문서가 바뀐 경우 바로 다시 그리고 바뀐 곳을 잠깐 칠한다.
// 연결 그래프를 보는 중이면 새로 고치지 않고 점과 선만 더하고 뺀다(graphLiveUpdate).
// 편집 중이거나 댓글을 쓰는 중이면 끊지 않고 아래쪽에 알림만 띄운다.
function toast(html, ms) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.innerHTML = html; t.hidden = false;
  clearTimeout(toast._t); if (ms) toast._t = setTimeout(() => { t.hidden = true; }, ms);
  return t;
}
function busy() {
  const ae = document.activeElement, ct = $('#ctext');
  return !!$('#etext') || !!(ct && ct.value.trim()) || !!(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.value);
}
function currentDoc() { const h = decodeURIComponent(location.hash.slice(1)); return h.startsWith('doc/') ? h.slice(4) : null; }
function touches(cur, paths) {
  const d = byPath.get(cur);
  return paths.some(p => p === cur || (/\.(svg|png|jpe?g|gif|webp)$/i.test(p) && d && d.text.includes(p.split('/').pop())));
}
function reloadKeeping(info) {
  try { sessionStorage.setItem('fv-live', JSON.stringify(Object.assign({ y: window.scrollY, hash: location.hash, known: D.docs.map(d => d.path) }, info))); } catch (e) { /* 못 남겨도 새로 고침은 한다 */ }
  location.reload();
}
function onFilesChanged(paths) {
  const cur = currentDoc(), view = (location.hash.slice(1) || 'recent').split('/')[0];
  const label = paths.length === 1 ? esc(paths[0]) : '문서 ' + paths.length + '개';
  const offer = () => { const t = toast('<span>' + label + '가 바뀌었어요.</span> <button type="button" class="pill on" id="tReload">새로 고침</button>'); $('#tReload').addEventListener('click', () => reloadKeeping({ path: cur, old: cur && byPath.get(cur) ? byPath.get(cur).text : '' })); };
  if (busy()) return offer();
  if (cur) { if (touches(cur, paths)) reloadKeeping({ path: cur, old: byPath.get(cur) ? byPath.get(cur).text : '' }); else offer(); return; }
  // 연결 그래프는 페이지를 다시 읽으면 배치, 확대, 이동, 끌어 놓은 자리가 모두 처음으로 돌아간다.
  // 그래서 새로 고치지 않고 최신 데이터만 받아 점과 선을 더하고 뺀다. 그림 파일만 바뀌었으면 그래프와 상관없다.
  if (view === 'graph') { if (paths.some(p => /\.(md|markdown)$/i.test(p))) graphLiveUpdate(offer); return; }
  reloadKeeping({});
}
let liveRunning = false, liveAgain = false;
async function graphLiveUpdate(offer) {
  if (liveRunning) { liveAgain = true; return; }
  if (LIVE && LIVE.dragging()) { graphWaiting = true; return; }
  liveRunning = true;
  try {
    const r = await fetch('/data', { cache: 'no-store' });
    if (!r.ok) throw new Error('데이터를 받지 못함 ' + r.status);
    const next = await r.json();
    // 받는 사이에 다른 화면으로 갔거나 무언가 쓰기 시작했으면 끼어들지 않는다
    if ((location.hash.slice(1) || 'recent').split('/')[0] !== 'graph' || busy()) { if (offer) offer(); return; }
    if (LIVE && LIVE.dragging()) { graphWaiting = true; return; }
    applyLiveData(next);
  } catch (e) {
    if (offer) offer(); // 서버가 예전 판이라 /data가 없으면 예전처럼 새로 고침 알림만 띄운다
  } finally {
    liveRunning = false;
    if (liveAgain) { liveAgain = false; graphLiveUpdate(offer); }
  }
}
// 그래프에 보이는 것만 모은 지문. 본문만 고친 경우는 지문이 같아 그래프를 건드리지 않는다
const graphSig = data => data.docs.map(d => [d.path, d.title, d.folder, d.fm && d.fm.type, d.fm && d.fm.status].join('\u0001')).join('\n') + '\n#\n' + data.edges.map(e => e.from + '|' + e.to + '|' + e.kind).join('\n');
function applyLiveData(next) {
  const same = graphSig(D) === graphSig(next);
  const before = new Set(D.docs.map(d => d.path));
  const carry = LIVE && !same ? LIVE.snapshot() : null;
  for (const k of Object.keys(D)) delete D[k];
  Object.assign(D, next);
  byPath.clear(); for (const d of D.docs) byPath.set(d.path, d);
  back.clear(); fwd.clear();
  for (const e of D.edges) {
    if (!back.has(e.to)) back.set(e.to, []);
    back.get(e.to).push(e);
    if (!fwd.has(e.from)) fwd.set(e.from, []);
    fwd.get(e.from).push(e);
  }
  // 새 폴더는 뒤에 붙인다. 다시 정렬하면 있던 폴더의 색이 바뀐다
  for (const d of D.docs) if (!folders.includes(d.folder)) folders.push(d.folder);
  $('#meta').textContent = '문서 ' + D.docs.length + '개, 연결 ' + D.edges.length + '개, ' + fmtTime(D.builtAt) + ' 생성';
  if (same) return;
  const after = new Set(D.docs.map(d => d.path));
  if (!carry) { viewGraph(); return; }
  carry.added = [...after].filter(p => !before.has(p));
  carry.removed = [...before].filter(p => !after.has(p));
  viewGraph(carry);
}
function flashChanges(oldText, newText) {
  const norm = s => s.replace(/[*_`#>|\-\[\]()!]/g, '').replace(/\s+/g, ' ').trim();
  const before = new Set(oldText.split('\n').map(norm));
  const added = newText.split('\n').map(norm).filter(l => l.length >= 4 && !before.has(l));
  if (!added.length) return 0;
  const keys = added.map(a => a.slice(0, Math.min(30, a.length)));
  let n = 0;
  document.querySelectorAll('#art p, #art li, #art td, #art th, #art h1, #art h2, #art h3, #art h4, #art pre, #art .cap').forEach(el => {
    const t = norm(el.textContent);
    if (keys.some(k => t.includes(k))) { el.classList.add('flash'); n++; }
  });
  return n;
}
(function afterReload() {
  let info = null;
  try { info = JSON.parse(sessionStorage.getItem('fv-live') || 'null'); sessionStorage.removeItem('fv-live'); } catch (e) { info = null; }
  if (!info || info.hash !== location.hash) return;
  window.scrollTo(0, info.y || 0);
  const cur = currentDoc();
  if (cur && info.path === cur && byPath.get(cur)) {
    const n = flashChanges(info.old || '', byPath.get(cur).text);
    const t = toast('<span>방금 바뀐 내용을 반영했어요' + (n ? ' (칠한 곳 ' + n + '군데)' : '') + '.</span>' + (n ? ' <button type="button" class="pill" id="tGo">바뀐 곳으로</button>' : ''), n ? 8000 : 3000);
    const go = $('#tGo'); if (go) go.addEventListener('click', () => { const f = document.querySelector('#art .flash'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.hidden = true; });
  } else if (!cur && Array.isArray(info.known)) {
    // 새로 생긴 문서: "최근 바뀐 것" 목록의 그 줄을 잠깐 칠한다
    const known = new Set(info.known);
    const fresh = D.docs.map(d => d.path).filter(p => !known.has(p));
    let n = 0;
    document.querySelectorAll('#view .row, #view .chgi').forEach(row => {
      const p = row.querySelector('.path');
      if (p && fresh.includes(p.textContent.trim())) { row.classList.add('flash'); n++; }
    });
    if (fresh.length) toast('<span>새 문서 ' + fresh.length + '개가 생겼어요.</span>', 5000);
  }
})();
if (SERVED && window.EventSource) {
  const es = new EventSource('/events');
  es.onmessage = ev => { try { onFilesChanged(JSON.parse(ev.data).paths || []); } catch (e) { /* 알림 형식이 다르면 무시 */ } };
}
})();
</script>
